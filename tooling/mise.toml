# Pinned shared toolchains for /opt/tooling (README.md). mise.lock records the
# resolved artifacts and their checksums; install.sh refuses anything it doesn't cover.
[settings]
lockfile = true

[tools]
# claude/user
"aqua:neovim/neovim" = "0.12.5"
claude = "2.1.301"
docker-cli = "29.9.0"
docker-compose = "5.6.0"
fd = "10.5.0"
fzf = "0.74.5"
gh = "2.102.0"
herdr = "0.9.5"
jq = "1.8.2"
ripgrep = "15.2.0"
tree-sitter = "0.27.1"

# build/test
"conda:clangxx" = "23.1.3"
cmake = "3.29.9"
go = "1.27.1"
java = "openjdk-17"
mold = "3.0.0"
ninja = "1.13.2"
node = "22"
rclone = "1.75.2"
rust = { version = "1.99.0", profile = "default" }
sccache = "0.18.0"
uv = "0.13.1"

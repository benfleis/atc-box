# Pinned shared toolchains for /opt/tooling (TOOLING.md). mise.lock records the
# resolved artifacts and their checksums; install.sh refuses anything it doesn't cover.
[settings]
lockfile = true
# Linux boxes only (atc-box): conda has no windows build of some tools (mosh), and nothing here runs elsewhere.
lockfile_platforms = ["linux-x64", "linux-arm64"]

[tools]
# claude/user
"aqua:neovim/neovim" = "0.12.5"
claude = "2.1.301"
codex = "0.163.0"
docker-cli = "29.9.0"
docker-compose = "5.6.0"
fd = "10.5.0"
fzf = "0.74.5"
gh = "2.102.0"
herdr = "0.9.5"
jq = "1.8.2"
pi = "1.5.0"
ripgrep = "15.2.0"
tree-sitter = "0.27.1"

# box/user (from the per-user mise configs, 2026-11-09; one copy for bfleis and atc)
"aqua:docker/buildx" = "0.38.0"
aws-cli = { version = "2.39.1", symlink_bins = "true" }
btop = "1.4.7"
bun = "1.3.14"
mosh = "1.4.0"
tmux = "3.7c"
# azure-cli: left out for now (pipx backend needs a lock sidecar that lock.sh does not keep; only Azure E2E needs it)
# lua: from AL2023 (dnf install lua), lua.org does not answer from AWS; conda:clang: clang comes from conda:clangxx (install.sh)

# build/test
"conda:clangxx" = "23.1.3"
cmake = "3.29.9"
go = "1.27.1"
java = "openjdk-17"
mold = "3.0.0"
ninja = "1.13.2"
node = "22"
rclone = "1.75.2"
rust = { version = "1.99.0", profile = "default" }
sccache = "0.18.0"
uv = "0.13.1"

# The pinned toolchains, one list for every machine (TOOLING.md):
# - atc boxes (Linux): `sudo ./install.sh` puts them in /opt/tooling, root-owned.
# - a user's own machine (the Mac): `./install-user.sh`, with MISE_GLOBAL_CONFIG_FILE=<repo>/mise.toml.
# mise.lock records the resolved artifacts and their checksums; both installs refuse anything it doesn't
# cover. Edit, then `./lock.sh`. Tools that only make sense on one OS carry `os = [...]`.
[settings]
lockfile = true
# The boxes and the owner's Mac; no windows (conda has no windows build of some tools, e.g. mosh).
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]

[tools]
# claude/user
"aqua:neovim/neovim" = "0.12.5"
claude = "2.1.301"
codex = "0.163.0"
docker-cli = "29.9.0"
docker-compose = "5.6.0"
fd = "10.5.0"
fzf = "0.74.5"
gh = "2.102.0"
herdr = "0.9.5"
jq = "1.8.2"
pi = "1.5.0"
ripgrep = "15.2.0"
"conda:tree-sitter-cli" = "0.27.1" # conda cuz it uses old glibc

# box/user (from the per-user mise configs, 2026-11-09; one copy for bfleis and atc)
"aqua:docker/buildx" = "0.38.0"
aws-cli = { version = "2.39.1", symlink_bins = "true" }
btop = "1.4.7"
"conda:lua" = "5.5.0"                                   # prebuilt from conda-forge: vfox lua compiles from lua.org, which does not answer from AWS
bun = "1.3.14"
mosh = "1.4.0"
tmux = "3.7c"
# azure-cli: left out for now (pipx backend needs a lock sidecar that lock.sh does not keep; only Azure E2E needs it)
# conda:clang: clang comes from conda:clangxx (install.sh)

# build/test
ccache = "4.14.3"                                      # C/C++ compiler cache (Rust stays on sccache); env/ccache.sh
"conda:clangxx" = { version = "23.1.3", os = ["linux"] }   # the box compiler (sysroot glibc 2.34, install.sh); the Mac uses Apple clang
cmake = "3.29.9"
go = "1.27.1"
java = "openjdk-17"
mold = { version = "3.0.0", os = ["linux"] }              # ELF linker
ninja = "1.13.2"
node = "22"
"conda:pkgconf" = "3.0.10"
rclone = "1.75.2"
rust = { version = "1.99.0", profile = "default" }
sccache = "0.18.0"
uv = "0.13.1"
